name: 东南大学讲座更新提醒

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: '发送微信测试消息'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seu-lecture-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: python -m unittest -q

      - name: 检查讲座并推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SEND_TEST: ${{ inputs.send_test }}
        run: python monitor.py

      - name: 保存通知记录
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 更新讲座通知记录'
            git push
          fi
